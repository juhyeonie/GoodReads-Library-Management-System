<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Management</title>
  <style>
/* ===== Reset & Base ===== */
* { box-sizing: border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family: "Gordita", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  background: #f0f2f4;
  color:#222;
}

/* ===== App layout ===== */
.app { display:flex; min-height:100vh; width:100%; }

/* Sidebar - YouTube-style behavior */
.sidebar {
  width: 280px;
  background: linear-gradient(180deg,#1b3c53 0%, #6f6b9b 100%);
  color: #fff;
  display:flex;
  flex-direction:column;
  position: fixed; 
  top:0; 
  left:0; 
  bottom:0;
  transition: width 0.2s ease;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(16,24,32,.08);
  overflow-x: hidden;
  overflow-y: auto;
}

.sidebar.collapsed {
  width: 72px;
}

@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
    width: 240px;
    transition: transform 0.3s ease;
  }
  
  .sidebar.mobile-open {
    transform: translateX(0);
    z-index: 2000;
  }
}

.sidebar-top {
  flex: 1;
  padding: 28px 18px;
}

.sidebar.collapsed .sidebar-top {
  padding: 20px 8px;
}

.collapse-btn {
  display:inline-block; 
  margin:8px 0 12px; 
  background: rgba(255,255,255,0.06);
  color:#fff; 
  border:none; 
  padding:6px 8px; 
  border-radius:6px; 
  cursor:pointer; 
  font-weight:700;
  transition: opacity 0.2s;
  width: 100%;
  text-align: left;
}

.sidebar.collapsed .collapse-btn {
  padding: 6px;
  text-align: center;
}

@media (max-width: 768px) { 
  .collapse-btn { display:none; } 
}

.logo {
  text-align: center;
  margin-bottom: 6px;
  overflow: hidden;
}

.logo-img { 
  width: 190px; 
  display:block; 
  margin: 0 auto; 
  transition: width 0.2s ease, opacity 0.2s ease; 
}

.logo-pic {
  width: 48px;
  display: none;
  margin: 0 auto;
  transition: width 0.2s ease, opacity 0.2s ease;
}

.sidebar.collapsed .logo-img {
  display: none;
}

.sidebar.collapsed .logo-pic {
  display: block;
}

.menu { 
  margin-top: 12px; 
  display:flex; 
  flex-direction:column; 
  gap:4px; 
}

.menu-item {
  display:flex; 
  align-items:center; 
  gap:16px; 
  padding:10px 12px; 
  border-radius:8px;
  text-decoration:none; 
  color:#fff; 
  font-weight:600; 
  transition: background 0.2s ease;
  white-space: nowrap;
  position: relative;
}

.sidebar.collapsed .menu-item {
  justify-content: center;
  padding: 10px;
  gap: 0;
}

.menu-item .icon { 
  width:24px; 
  height: 24px;
  display:flex; 
  align-items:center; 
  justify-content:center;
  flex-shrink: 0;
}

.menu-item .icon img { 
  width:22px; 
  height:22px; 
  object-fit:contain; 
}

.menu-item .text {
  transition: opacity 0.2s ease;
  overflow: hidden;
}

.sidebar.collapsed .menu-item .text {
  opacity: 0;
  width: 0;
  display: none;
}

.menu-item.active, .menu-item:hover { 
  background: rgba(255,255,255,0.12); 
}

.sidebar.collapsed .menu-item::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 100%;
  margin-left: 8px;
  padding: 6px 12px;
  background: rgba(0,0,0,0.9);
  color: white;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  font-size: 13px;
  z-index: 1000;
}

.sidebar.collapsed .menu-item:hover::after {
  opacity: 1;
}

.sidebar-bottom {
  padding: 16px 18px 28px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.sidebar.collapsed .sidebar-bottom {
  padding: 16px 8px 20px;
}

.user {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  transition: all 0.2s;
}

.sidebar.collapsed .user {
  flex-direction: column;
  gap: 8px;
}

.sidebar.collapsed .username {
  display: none;
}

.logout-icon img { 
  width:28px; 
  height:28px; 
}

/* ===== Main content ===== */
.main-content {
  margin-left: 280px;
  padding: 28px 34px;
  width: calc(100% - 280px);
  transition: margin-left 0.2s ease, width 0.2s ease;
  min-height:100vh;
}

.main-content.collapsed {
  margin-left: 72px;
  width: calc(100% - 72px);
}

@media (max-width: 768px) {
  .main-content {
    margin-left: 0;
    width: 100%;
    padding: 60px 16px 16px;
  }
  
  .main-content.collapsed {
    margin-left: 0;
    width: 100%;
  }
}

.menu-toggle {
  display:none; 
  position:fixed; 
  left:16px; 
  top:14px; 
  z-index:1100;
  background:#1b3c53; 
  color:#fff; 
  border:none; 
  padding:10px 12px; 
  border-radius:6px;
  font-size: 20px;
  cursor:pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

@media (max-width: 768px) {
  .menu-toggle {
    display: block;
  }
}

.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1500;
}

@media (max-width: 768px) {
  .sidebar-overlay.active {
    display: block;
  }
}

/* ===== Top area ===== */
.top-bar { 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
  margin-bottom:18px; 
  gap:12px; 
  flex-wrap:wrap; 
}

.top-bar h1 { 
  color:#1b3c53; 
}

.search-panel {
  display:flex; 
  gap:8px; 
  align-items:center;
}

.search-container {
  display:flex; 
  align-items: center; 
  background:white; 
  border:1px solid #1b3c53; 
  border-radius:8px; 
  padding:4px 8px;
  width:460px; 
  height:36px; 
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}

@media (max-width: 768px) {
  .search-container {
    width: 100%;
    min-width: 200px;
  }
}

.search-container input { 
  border:0; 
  outline:none; 
  padding:6px 8px; 
  font-size:14px; 
  width:100%; 
}

.search-btn { 
  background:transparent; 
  border:0; 
  cursor:pointer; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  padding:0; 
}

.search-btn img { 
  width:18px; 
  height:18px; 
  opacity:.7; 
  transition: .2s; 
}

.search-btn:hover img { 
  opacity:1; 
}

.filter-select { 
  padding:6px 10px; 
  border-radius:8px; 
  border:1px solid #1b3c53; 
}

.table-section {
  background:#fff; 
  border-radius:8px; 
  padding:12px; 
  border:1px solid rgba(0,0,0,.06);
  overflow:auto;
  box-shadow: 0 6px 18px rgba(16,24,40,0.03);
}

.table-top { 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
  margin-bottom:10px; 
  gap:8px; 
}

.table-top h2 { 
  color:#1b3c53; 
  font-size:18px; 
  margin-left:6px; 
}

.table-wrap { 
  overflow:auto; 
}

table { 
  width:100%; 
  border-collapse:collapse; 
  min-width:600px; 
}

thead th {
  background:#1b3c53; 
  color:#fff; 
  font-weight:700; 
  text-align:left; 
  padding:12px 10px;
  border:1px solid rgba(0,0,0,0.12);
}

tbody td {
  padding:12px 10px; 
  border:1px solid rgba(0,0,0,0.16); 
  vertical-align:middle; 
  background:#fff;
}

tbody tr td:first-child { 
  width:120px; 
}

.actions { 
  display:flex; 
  gap:8px; 
  justify-content:flex-start; 
}

.pill {
  border:none; 
  border-radius:8px; 
  padding:6px 12px; 
  cursor:pointer; 
  background:#456882; 
  color:#fff; 
  font-weight:700; 
  font-size:13px;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
}

.pill.view {
  background:#5a7a92;
}

.pill.delete { 
  background:#2f4f5d; 
}

.add-user {
  padding:8px 14px; 
  border-radius:8px; 
  background:#123b4f; 
  color:#fff; 
  border:none; 
  cursor:pointer; 
  font-weight:700;
  float: right;
  margin-top:12px;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; 
  inset:0; 
  display:none; 
  align-items:center; 
  justify-content:center; 
  background: rgba(10,14,18,0.6); 
  z-index: 10000;
  padding:28px;
}

.modal-overlay.show { 
  display:flex; 
}

.modal-box {
  width:600px; 
  max-width:calc(100% - 48px); 
  background:#fff; 
  border-radius:6px; 
  overflow:hidden;
  box-shadow: 0 18px 42px rgba(16,24,40,0.3); 
  display:flex; 
  flex-direction:column; 
  position:relative;
  animation: fadeIn .18s ease;
}

.modal-topbar { 
  height:48px; 
  background: linear-gradient(90deg,#1b3c53 0%, #908daf 100%); 
}

.modal-body { 
  padding:34px 40px 22px 40px; 
}

.modal-title { 
  color:#456882; 
  font-size:20px; 
  margin-bottom:24px; 
  font-weight:700; 
}

.user-form .field { 
  margin-bottom:14px; 
  position: relative;
}

.user-form input[type="text"], 
.user-form input[type="email"], 
.user-form input[type="password"], 
.user-form select {
  width:100%; 
  padding:10px 12px; 
  border-radius:8px; 
  border:1px solid #c7ced2; 
  font-size:14px; 
  color:#556;
  background:#fff; 
  outline:none;
  transition: border-color 0.2s;
}

.user-form input.error, 
.user-form select.error {
  border-color: #dc3545;
  background-color: #fff5f5;
}

.error-message {
  color: #dc3545;
  font-size: 12px;
  margin-top: 4px;
  display: none;
}

.error-message.show {
  display: block;
}

.modal-bottombar {
  height:62px; 
  background: linear-gradient(90deg,#1b3c53 0%, #908daf 100%); 
  display:flex; 
  align-items:center; 
  justify-content:flex-end; 
  padding:0 18px;
}

.modal-actions { 
  display:flex; 
  gap:10px; 
}

.btn { 
  border:none; 
  padding:8px 12px; 
  border-radius:6px; 
  font-weight:700; 
  cursor:pointer; 
  font-size:13px; 
}

.btn.confirm { 
  background:#fff; 
  color:#1b3c53; 
}

.btn.cancel { 
  background: rgba(255,255,255,0.14); 
  color:#fff; 
}

/* ===== Delete confirm modal ===== */
.confirm-box { 
  width:420px; 
  max-width:calc(100% - 48px); 
  padding:18px; 
  border-radius:8px; 
  background:#fff; 
  box-shadow:0 12px 32px rgba(0,0,0,0.12);
  text-align:left;
}

.confirm-actions { 
  display:flex; 
  gap:10px; 
  justify-content:flex-end; 
  margin-top:12px; 
}

@keyframes fadeIn { 
  from { opacity:0; transform:translateY(-6px); } 
  to { opacity:1; transform:none; } 
}

body.no-scroll {
  overflow: hidden;
}
  </style>
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SuperAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SuperAdmin-User.html" class="menu-item active" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Management</span>
          </a>
          <a href="SuperAdmin-Admin.html" class="menu-item" data-tooltip="Admin Management">
            <span class="icon"><img src="admin.png" alt="" /></span>
            <span class="text">Admin Management</span>
          </a>
          <a href="SuperAdmin-Subscription.html" class="menu-item" data-tooltip="Plan Management">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Plan Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">User Admin1</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <h1>Customer Management</h1>

        <div class="search-panel">
          <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search receipt / email..." />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>
          <select id="filterSelect" class="filter-select">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
            <option value="expired">Expired</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <section class="table-section">
        <div class="table-top">
          <h2>List of customers</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable">
            <thead>
              <tr>
                <th>ID no</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new user</button>
      </section>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Edit user details</h2>
        <form id="editForm" class="user-form">
          <div class="field">
            <input id="editEmail" name="email" type="email" placeholder="Email" />

          <div class="field">
            <input id="editPassword" name="password" type="password" placeholder="Password" />
            <div class="error-message" id="editPasswordError"></div>
          </div>
          <div class="field">
            <select id="editPlan" name="plan">
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>

            <div class="error-message" id="editPlanError"></div>
          </div>
          <div class="field">
            <select id="editPayment" name="payment">
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>

      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Add a new user</h2>
        <form id="addForm" class="user-form">
          <div class="field">
            <input id="addEmail" name="email" type="email" placeholder="Email" />
            <div class="error-message" id="addEmailError"></div>
          </div>
          <div class="field">
            <input id="addPassword" name="password" type="password" placeholder="Password" />
            <div class="error-message" id="addPasswordError"></div>
          </div>
          <div class="field">
            <select id="addPlan" name="plan">
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
            </select>
            <div class="error-message" id="addPlanError"></div>
          </div>
          <div class="field">
            <select id="addPayment" name="payment">
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
            <div class="error-message" id="addPaymentError"></div>
          </div>
          <input type="hidden" id="addReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal-overlay">
    <div class="confirm-box">
      <div>
        <h3 style="color:#1b3c53; margin-bottom:8px;">Confirm deletion</h3>
        <p id="deleteMessage">Are you sure you want to delete this user?</p>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="btn confirm" type="button">YES, DELETE</button>
          <button id="cancelDeleteBtn" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sidebar behavior
    (function() {
      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menuToggle');
      const collapseBtn = document.getElementById('collapseBtn');
      const mainContent = document.getElementById('mainContent');
      const overlay = document.getElementById('sidebarOverlay');
      
      const COLLAPSED_KEY = 'sidebar_collapsed';
      const MOBILE_BREAKPOINT = 768;

      function isMobile() {
        return window.innerWidth <= MOBILE_BREAKPOINT;
      }

      function updateLayout() {
        if (isMobile()) {
          sidebar.classList.remove('collapsed');
          mainContent.classList.remove('collapsed');
          sidebar.classList.remove('mobile-open');
          overlay.classList.remove('active');
        } else {
          const isCollapsed = localStorage.getItem(COLLAPSED_KEY) === 'true';
          sidebar.classList.toggle('collapsed', isCollapsed);
          mainContent.classList.toggle('collapsed', isCollapsed);
          sidebar.classList.remove('mobile-open');
          overlay.classList.remove('active');
        }
      }

      updateLayout();
      window.addEventListener('resize', updateLayout);

      if (collapseBtn) {
        collapseBtn.addEventListener('click', () => {
          if (isMobile()) return;
          const isCollapsed = sidebar.classList.toggle('collapsed');
          mainContent.classList.toggle('collapsed', isCollapsed);
          localStorage.setItem(COLLAPSED_KEY, isCollapsed);
        });
      }

      if (menuToggle) {
        menuToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          sidebar.classList.toggle('mobile-open');
          overlay.classList.toggle('active');
        });
      }

      if (overlay) {
        overlay.addEventListener('click', () => {
          sidebar.classList.remove('mobile-open');
          overlay.classList.remove('active');
        });
      }

      const menuLinks = sidebar.querySelectorAll('.menu-item');
      menuLinks.forEach(link => {
        link.addEventListener('click', () => {
          if (isMobile()) {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
          }
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isMobile() && sidebar.classList.contains('mobile-open')) {
          sidebar.classList.remove('mobile-open');
          overlay.classList.remove('active');
        }
      });
    })();

    // Customer Management
    (function() {
      let nextId = 1008;
      
      const demoUsers = [
        { receipt: '1000', email: 'dfdfd', plan: 'free', payment: 'credit_card', password: 'pass1' },
        { receipt: '1001', email: 'alice@example.com', plan: 'standard', payment: 'gcash', password: 'pass2' },
        { receipt: '1002', email: 'bob@example.com', plan: 'premium', payment: 'maya', password: 'pass3' },
        { receipt: '1003', email: 'jane.doe@example.com', plan: 'free', payment: 'paypal', password: 'pass4' },
        { receipt: '1004', email: 'john.smith@example.com', plan: 'standard', payment: 'credit_card', password: 'pass5' },
        { receipt: '1005', email: 'user5@example.com', plan: 'premium', payment: 'gcash', password: 'pass6' },
        { receipt: '1006', email: 'user6@example.com', plan: 'free', payment: 'maya', password: 'pass7' },
        { receipt: '1007', email: 'user7@example.com', plan: 'cancelled', payment: 'paypal', password: 'pass8' }
      ];

      let users = demoUsers.slice();

      const tbody = document.querySelector('#usersTable tbody');
      const searchInput = document.getElementById('searchInput');
      const filterSelect = document.getElementById('filterSelect');

      function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, s => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[s]));
      }

      function formatPaymentMethod(method) {
        const methods = {
          'credit_card': 'Credit Card',
          'gcash': 'GCash',
          'maya': 'Maya',
          'paypal': 'PayPal'
        };
        return methods[method] || method;
      }

      function formatPlan(plan) {
        return plan.charAt(0).toUpperCase() + plan.slice(1);
      }

      function renderTable(rows) {
        tbody.innerHTML = '';
        rows.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escapeHtml(u.receipt)}</td>
            <td>${escapeHtml(u.email)}</td>
            <td>${escapeHtml(formatPlan(u.plan))}</td>
            <td>${escapeHtml(formatPaymentMethod(u.payment))}</td>
            <td>
              <div class="actions">
                <button class="pill view" data-id="${escapeHtml(u.receipt)}">View</button>
                <button class="pill edit" data-id="${escapeHtml(u.receipt)}">Edit</button>
                <button class="pill delete" data-id="${escapeHtml(u.receipt)}">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function applyFilters() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const f = filterSelect.value;
      
        const filtered = users.filter(u => {
          const matchText = !q || (u.receipt + ' ' + u.email).toLowerCase().includes(q);
          const matchFilter = f === 'all' || u.plan === f;
          return matchText && matchFilter;
        });
        renderTable(filtered);
      }

      applyFilters();
      if (searchInput) searchInput.addEventListener('input', applyFilters);
      if (filterSelect) filterSelect.addEventListener('change', applyFilters);

      // Modals
      const editModal = document.getElementById('editModal');
      const editForm = document.getElementById('editForm');
      const editEmail = document.getElementById('editEmail');
      const editPassword = document.getElementById('editPassword');
      const editPlan = document.getElementById('editPlan');
      const editPayment = document.getElementById('editPayment');
      const editReceipt = document.getElementById('editReceipt');
      const confirmEdit = document.getElementById('confirmEdit');
      const cancelEdit = document.getElementById('cancelEdit');

      const addModal = document.getElementById('addModal');
      const addForm = document.getElementById('addForm');
      const addEmail = document.getElementById('addEmail');
      const addPassword = document.getElementById('addPassword');
      const addPlan = document.getElementById('addPlan');
      const addPayment = document.getElementById('addPayment');
      const addReceipt = document.getElementById('addReceipt');
      const confirmAdd = document.getElementById('confirmAdd');
      const cancelAdd = document.getElementById('cancelAdd');
      const addUserBtn = document.getElementById('addUserBtn');

      function showModal(modal) {
        modal.classList.add('show');
        document.body.classList.add('no-scroll');
      }

      function hideModal(modal) {
        modal.classList.remove('show');
        document.body.classList.remove('no-scroll');
      }

      function clearErrors(form) {
        form.querySelectorAll('input, select').forEach(el => {
          el.classList.remove('error');
        });
        form.querySelectorAll('.error-message').forEach(el => {
          el.classList.remove('show');
          el.textContent = '';
        });
      }

      function showError(fieldId, message) {
        const field = document.getElementById(fieldId);
        const errorDiv = document.getElementById(fieldId + 'Error');
        if (field) field.classList.add('error');
        if (errorDiv) {
          errorDiv.textContent = message;
          errorDiv.classList.add('show');
        }
      }

      function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
      }

      function validateForm(email, password, plan, payment, prefix) {
        let isValid = true;
        clearErrors(document.getElementById(prefix + 'Form'));

        if (!email || email.trim() === '') {
          showError(prefix + 'Email', 'Email is required');
          isValid = false;
        } else if (!validateEmail(email)) {
          showError(prefix + 'Email', 'Please enter a valid email address');
          isValid = false;
        }

        if (!password || password.trim() === '') {
          showError(prefix + 'Password', 'Password is required');
          isValid = false;
        } else if (password.length < 6) {
          showError(prefix + 'Password', 'Password must be at least 6 characters');
          isValid = false;
        }

        if (!plan || plan === '') {
          showError(prefix + 'Plan', 'Please select a plan');
          isValid = false;
        }

        if (!payment || payment === '') {
          showError(prefix + 'Payment', 'Please select a payment method');
          isValid = false;
        }

        return isValid;
      }

      function openEditFor(receipt) {
        const user = users.find(u => u.receipt === receipt);
        if (!user) return;
        
        editReceipt.value = user.receipt;
        editEmail.value = user.email;
        editPassword.value = user.password || '';
        editPlan.value = user.plan || '';
        editPayment.value = user.payment || '';
        clearErrors(editForm);
        showModal(editModal);
      }

      confirmEdit.addEventListener('click', (e) => {
        e.preventDefault();
        
        const email = editEmail.value.trim();
        const password = editPassword.value;
        const plan = editPlan.value;
        const payment = editPayment.value;

        if (!validateForm(email, password, plan, payment, 'edit')) {
          return;
        }

        const receipt = editReceipt.value;
        const idx = users.findIndex(u => u.receipt === receipt);
        if (idx >= 0) {
          users[idx].email = email;
          users[idx].password = password;
          users[idx].plan = plan;
          users[idx].payment = payment;
          applyFilters();
        }
        hideModal(editModal);
      });

      cancelEdit.addEventListener('click', () => {
        hideModal(editModal);
      });

      editModal.addEventListener('click', (e) => {
        if (e.target === editModal) hideModal(editModal);
      });

      addUserBtn.addEventListener('click', () => {
        addReceipt.value = String(nextId);
        addEmail.value = '';
        addPassword.value = '';
        addPlan.value = '';
        addPayment.value = '';
        clearErrors(addForm);
        showModal(addModal);
      });

      confirmAdd.addEventListener('click', (e) => {
        e.preventDefault();
        
        const email = addEmail.value.trim();
        const password = addPassword.value;
        const plan = addPlan.value;
        const payment = addPayment.value;

        if (!validateForm(email, password, plan, payment, 'add')) {
          return;
        }

        const newUser = {
          receipt: addReceipt.value,
          email: email,
          password: password,
          plan: plan,
          payment: payment
        };
        users.unshift(newUser);
        nextId++;
        applyFilters();
        hideModal(addModal);
      });

      cancelAdd.addEventListener('click', () => {
        hideModal(addModal);
      });

      addModal.addEventListener('click', (e) => {
        if (e.target === addModal) hideModal(addModal);
      });

      // Delete modal
      const deleteModal = document.getElementById('deleteModal');
      const deleteMessage = document.getElementById('deleteMessage');
      const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
      const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
      let deleteTargetId = null;

      function showDeleteModal(message) {
        deleteMessage.textContent = message || 'Are you sure you want to delete this user?';
        showModal(deleteModal);
        setTimeout(() => confirmDeleteBtn && confirmDeleteBtn.focus(), 80);
      }

      function hideDeleteModal() {
        hideModal(deleteModal);
        deleteTargetId = null;
      }

      confirmDeleteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!deleteTargetId) { 
          hideDeleteModal(); 
          return; 
        }
        users = users.filter(u => u.receipt !== deleteTargetId);
        applyFilters();
        hideDeleteModal();
      });

      cancelDeleteBtn.addEventListener('click', () => {
        hideDeleteModal();
      });

      deleteModal.addEventListener('click', (e) => {
        if (e.target === deleteModal) hideDeleteModal();
      });

      // Table actions
      tbody.addEventListener('click', (e) => {
        const editBtn = e.target.closest('.edit');
        if (editBtn) {
          const id = editBtn.dataset.id;
          openEditFor(id);
          return;
        }

        const delBtn = e.target.closest('.delete');
        if (delBtn) {
          const id = delBtn.dataset.id;
          deleteTargetId = id;
          showDeleteModal('Delete user ' + id + '? This action cannot be undone.');
          return;
        }
      });

      // ESC key
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') {
          if (editModal.classList.contains('show')) hideModal(editModal);
          if (addModal.classList.contains('show')) hideModal(addModal);
          if (deleteModal.classList.contains('show')) hideDeleteModal();
        }
      });

    })();
  </script>
</body>
</html>
