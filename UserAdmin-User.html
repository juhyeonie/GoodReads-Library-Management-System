<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Management</title>
  <style>
  /* ===== Reset & Base ===== */
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family: "Gordita", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: #f0f2f4;
    color:#222;
  }

  /* ===== App layout ===== */
  .app { display:flex; min-height:100vh; width:100%; }

  /* Sidebar - YouTube-style behavior */
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg,#1b3c53 0%, #6f6b9b 100%);
    color: #fff;
    display:flex;
    flex-direction:column;
    position: fixed; 
    top:0; 
    left:0; 
    bottom:0;
    transition: width 0.2s ease;
    z-index: 1000;
    box-shadow: 0 2px 6px rgba(16,24,32,.08);
    overflow-x: hidden;
    overflow-y: auto;
  }

  .sidebar.collapsed {
    width: 72px;
  }

  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      width: 240px;
      transition: transform 0.3s ease;
    }
    
    .sidebar.mobile-open {
      transform: translateX(0);
      z-index: 2000;
    }
  }

  .sidebar-top {
    flex: 1;
    padding: 28px 18px;
  }

  .sidebar.collapsed .sidebar-top {
    padding: 20px 8px;
  }

  .collapse-btn {
    display:inline-block; 
    margin:8px 0 12px; 
    background: rgba(255,255,255,0.06);
    color:#fff; 
    border:none; 
    padding:6px 8px; 
    border-radius:6px; 
    cursor:pointer; 
    font-weight:700;
    transition: opacity 0.2s;
    width: 100%;
    text-align: left;
  }

  .sidebar.collapsed .collapse-btn {
    padding: 6px;
    text-align: center;
  }

  @media (max-width: 768px) { 
    .collapse-btn { display:none; } 
  }

  .logo {
    text-align: center;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .logo-img { 
    width: 190px; 
    display:block; 
    margin: 0 auto; 
    transition: width 0.2s ease, opacity 0.2s ease; 
  }

  .logo-pic {
    width: 48px;
    display: none;
    margin: 0 auto;
    transition: width 0.2s ease, opacity 0.2s ease;
  }

  .sidebar.collapsed .logo-img {
    display: none;
  }

  .sidebar.collapsed .logo-pic {
    display: block;
  }

  .menu { 
    margin-top: 12px; 
    display:flex; 
    flex-direction:column; 
    gap:4px; 
  }

  .menu-item {
    display:flex; 
    align-items:center; 
    gap:16px; 
    padding:10px 12px; 
    border-radius:8px;
    text-decoration:none; 
    color:#fff; 
    font-weight:600; 
    transition: background 0.2s ease;
    white-space: nowrap;
    position: relative;
  }

  .sidebar.collapsed .menu-item {
    justify-content: center;
    padding: 10px;
    gap: 0;
  }

  .menu-item .icon { 
    width:24px; 
    height: 24px;
    display:flex; 
    align-items:center; 
    justify-content:center;
    flex-shrink: 0;
  }

  .menu-item .icon img { 
    width:22px; 
    height:22px; 
    object-fit:contain; 
  }

  .menu-item .text {
    transition: opacity 0.2s ease;
    overflow: hidden;
  }

  .sidebar.collapsed .menu-item .text {
    opacity: 0;
    width: 0;
    display: none;
  }

  .menu-item.active, .menu-item:hover { 
    background: rgba(255,255,255,0.12); 
  }

  .sidebar.collapsed .menu-item::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 100%;
    margin-left: 8px;
    padding: 6px 12px;
    background: rgba(0,0,0,0.9);
    color: white;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    font-size: 13px;
    z-index: 1000;
  }

  .sidebar.collapsed .menu-item:hover::after {
    opacity: 1;
  }

  .sidebar-bottom {
    padding: 16px 18px 28px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .sidebar.collapsed .sidebar-bottom {
    padding: 16px 8px 20px;
  }

  .user {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    transition: all 0.2s;
  }

  .sidebar.collapsed .user {
    flex-direction: column;
    gap: 8px;
  }

  .sidebar.collapsed .username {
    display: none;
  }

  .logout-icon img { 
    width:28px; 
    height:28px; 
  }

  /* ===== Main content ===== */
  .main-content {
    margin-left: 280px;
    padding: 28px 34px;
    width: calc(100% - 280px);
    transition: margin-left 0.2s ease, width 0.2s ease;
    min-height:100vh;
  }

  .main-content.collapsed {
    margin-left: 72px;
    width: calc(100% - 72px);
  }

  @media (max-width: 768px) {
    .main-content {
      margin-left: 0;
      width: 100%;
      padding: 60px 16px 16px;
    }
    
    .main-content.collapsed {
      margin-left: 0;
      width: 100%;
    }
  }

  .menu-toggle {
    display:none; 
    position:fixed; 
    left:16px; 
    top:14px; 
    z-index:1100;
    background:#1b3c53; 
    color:#fff; 
    border:none; 
    padding:10px 12px; 
    border-radius:6px;
    font-size: 20px;
    cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  @media (max-width: 768px) {
    .menu-toggle {
      display: block;
    }
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1500;
  }

  @media (max-width: 768px) {
    .sidebar-overlay.active {
      display: block;
    }
  }

  /* ===== Top area (search) ===== */
  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; flex-wrap:wrap; }
  .top-bar h1 { color:#1b3c53; font-size:28px; }

  .search-panel {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .search-input {
    display:flex; align-items: center; background:white; border:1px solid #1b3c53; border-radius:8px; padding:4px 8px;
    width:460px; height:36px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }

  @media (max-width: 768px) {
    .search-input {
      width: 100%;
      min-width: 200px;
    }
  }

  .search-input input {
    border:0; outline:none; padding:6px 8px; font-size:14px; width:100%;
  }
  .search-input button { 
    background:transparent; border:0; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; 
  }

  .search-input button img { 
    width:18px; height:18px; opacity:.7; transition: .2s; 
  }
  .search-input button:hover img { opacity:1; }

  .filter-select { padding:6px 12px; border-radius:8px; border:1px solid #1b3c53; }

  /* ===== Table section ===== */
  .table-section {
    background:#fff; border-radius:8px; padding:12px; border:1px solid rgba(0,0,0,.06);
    overflow:auto;
    box-shadow: 0 6px 18px rgba(16,24,40,0.03);
  }
  .table-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  .table-top h2 { color:#1b3c53; font-size:18px; margin-left:6px; }

  .table-wrap { overflow:auto; }
  table { width:100%; border-collapse:collapse; min-width:900px; }
  thead th {
    background:#1b3c53; color:#fff; font-weight:700; text-align:left; padding:12px 10px;
    border:1px solid rgba(0,0,0,0.12);
  }
  tbody td {
    padding:12px 10px; border:1px solid rgba(0,0,0,0.16); vertical-align:middle; background:#fff;
  }
  tbody tr td:first-child { width:120px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; }

  .pill {
    border:none; border-radius:8px; padding:6px 12px; cursor:pointer; background:#456882; color:#fff; font-weight:700; font-size:13px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
  }
  .pill.delete { background:#2f4f5d; }

  .add-user {
    padding:8px 14px; border-radius:8px; background:#123b4f; color:#fff; border:none; cursor:pointer; font-weight:700;
    float: right;
    margin-top:12px;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset:0; display:none; align-items:center; justify-content:center; background: rgba(10,14,18,0.6); z-index:10000; padding:28px;
  }
  .modal-overlay.show { display:flex; }

  .modal-box {
    width:600px; max-width:calc(100% - 48px); background:#fff; border-radius:6px; overflow:hidden;
    box-shadow: 0 18px 42px rgba(16,24,40,0.3); display:flex; flex-direction:column; position:relative;
    animation: fadeIn .18s ease;
  }
  .modal-topbar { height:48px; background: linear-gradient(90deg,#1b3c53 0%, #908daf 100%); }
  .modal-body { padding:34px 40px 22px 40px; }
  .modal-title { color:#456882; font-size:20px; margin-bottom:24px; font-weight:700; }

  .user-form .field { margin-bottom:14px; }
  .user-form input[type="text"], .user-form input[type="email"], .user-form input[type="password"], .user-form select {
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #c7ced2; font-size:14px; color:#556;
    background:#fff; outline:none;
  }

  .modal-bottombar {
    height:62px; background: linear-gradient(90deg,#1b3c53 0%, #908daf 100%); display:flex; align-items:center; justify-content:flex-end; padding:0 18px;
  }
  .modal-actions { display:flex; gap:10px; }
  .btn { border:none; padding:8px 12px; border-radius:6px; font-weight:700; cursor:pointer; font-size:13px; }
  .btn.confirm { background:#fff; color:#1b3c53; }
  .btn.cancel { background: rgba(255,255,255,0.14); color:#fff; }

  /* ===== Delete confirm modal ===== */
  .confirm-box { width:420px; max-width:calc(100% - 48px); padding:18px; border-radius:8px; background:#fff; box-shadow:0 12px 32px rgba(0,0,0,0.12);
    text-align:left;
  }
  .confirm-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }

  body.no-scroll { overflow: hidden; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }

  /* ===== Responsive ===== */
  @media (max-width:800px) {
    table { min-width:600px; }
  }
  @media (max-width:420px) {
    table { min-width:520px; }
    .modal-box { width:100%; }
  }
  </style>
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn" aria-pressed="false" title="Toggle sidebar">☰</button>

        <nav class="menu" aria-label="Primary navigation">
          <a href="UserAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon">
              <img src="dashboard.png" alt="" />
            </span>
            <span class="text">Dashboard</span>
          </a>
          <a href="UserAdmin-User.html" class="menu-item active" data-tooltip="Customer Management">
            <span class="icon">
              <img src="user.png" alt="" />
            </span>
            <span class="text">Customer Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">User Admin1</p>
          <a href="#" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" /></a>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="mainContent" class="main-content" role="main">
      <div class="top-bar">
        <h1>Customer Management</h1>

        <div class="search-panel">
          <div class="search-input" role="search">
            <input id="searchInput" type="search" placeholder="Search receipt / email..." aria-label="Search users">
            <button id="searchBtn" aria-label="Search"><img src="search.png" alt="" /></button>
          </div>

          <select id="filterSelect" class="filter-select" aria-label="Filter users">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
            <option value="expired">Expired</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <section class="table-section" aria-labelledby="customers-heading">
        <div class="table-top">
          <h2 id="customers-heading">List of customers</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable" aria-describedby="customers-heading">
            <thead>
              <tr>
                <th>ID no</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- injected by JS -->
            </tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new user</button>
      </section>
    </main>
  </div>

  <!-- ===== Edit User Modal ===== -->
  <div id="editModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 id="editTitle" class="modal-title">Edit user details</h2>
        <form id="editForm" class="modal-form user-form" autocomplete="off">
          <div class="field">
            <input id="editEmail" name="email" type="email" placeholder="Email" required>
          </div>
          <div class="field">
            <input id="editPassword" name="password" type="password" placeholder="Password" required>
          </div>
          <div class="field">
            <select id="editPlan" name="plan" required>
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field">
            <select id="editPayment" name="payment" required>
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
          </div>
          <input type="hidden" id="editReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Add User Modal ===== -->
  <div id="addModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 id="addTitle" class="modal-title">Add a new user</h2>
        <form id="addForm" class="modal-form user-form" autocomplete="off" novalidate>
          <div class="field">
            <input id="addEmail" name="email" type="email" placeholder="Email" required>
          </div>
          <div class="field">
            <input id="addPassword" name="password" type="password" placeholder="Password" required>
          </div>
          <div class="field">
            <select id="addPlan" name="plan" required>
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field">
            <select id="addPayment" name="payment" required>
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
          </div>
          <input type="hidden" id="addReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Delete Confirm Modal ===== -->
  <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="confirm-box" role="document" aria-live="assertive">
      <div>
        <h3 id="deleteTitle" style="color:#1b3c53; margin-bottom:8px;">Confirm deletion</h3>
        <p id="deleteMessage">Are you sure you want to delete this user?</p>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="btn confirm">YES, DELETE</button>
          <button id="cancelDeleteBtn" class="btn cancel">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const COLLAPSED_KEY = 'sidebar_collapsed';
  const MOBILE_BREAKPOINT = 768;

  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const collapseBtn = document.getElementById('collapseBtn');
  const mainContent = document.getElementById('mainContent');
  const overlay = document.getElementById('sidebarOverlay');

  function isMobile() { 
    return window.innerWidth <= MOBILE_BREAKPOINT; 
  }

  function updateLayout() {
    if (isMobile()) {
      sidebar.classList.remove('collapsed');
      mainContent.classList.remove('collapsed');
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
    } else {
      const isCollapsed = localStorage.getItem(COLLAPSED_KEY) === 'true';
      sidebar.classList.toggle('collapsed', isCollapsed);
      mainContent.classList.toggle('collapsed', isCollapsed);
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
    }
  }

  updateLayout();
  window.addEventListener('resize', updateLayout);

  if (collapseBtn) {
    collapseBtn.addEventListener('click', () => {
      if (isMobile()) return;
      const isCollapsed = sidebar.classList.toggle('collapsed');
      mainContent.classList.toggle('collapsed', isCollapsed);
      collapseBtn.setAttribute('aria-pressed', String(isCollapsed));
      localStorage.setItem(COLLAPSED_KEY, isCollapsed);
    });
  }

  if (menuToggle) {
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('active');
    });
  }

  if (overlay) {
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
    });
  }

  const menuLinks = sidebar.querySelectorAll('.menu-item');
  menuLinks.forEach(link => {
    link.addEventListener('click', () => {
      if (isMobile()) {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('active');
      }
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isMobile() && sidebar.classList.contains('mobile-open')) {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
    }
  });

  /* ---------------- Demo data & table rendering ---------------- */
  let nextId = 1008;
  
  const demoUsers = [
    { receipt: '1000', email: 'dfdfd', plan: 'free', payment: 'credit_card' },
    { receipt: '1001', email: 'alice@example.com', plan: 'standard', payment: 'gcash' },
    { receipt: '1002', email: 'bob@example.com', plan: 'premium', payment: 'maya' },
    { receipt: '1003', email: 'jane.doe@example.com', plan: 'free', payment: 'paypal' },
    { receipt: '1004', email: 'john.smith@example.com', plan: 'standard', payment: 'credit_card' },
    { receipt: '1005', email: 'user5@example.com', plan: 'premium', payment: 'gcash' },
    { receipt: '1006', email: 'user6@example.com', plan: 'free', payment: 'maya' },
    { receipt: '1007', email: 'user7@example.com', plan: 'cancelled', payment: 'paypal' }
  ];

  let users = demoUsers.slice();

  const tbody = document.querySelector('#usersTable tbody');
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function formatPaymentMethod(method) {
    const methods = {
      'credit_card': 'Credit Card',
      'gcash': 'GCash',
      'maya': 'Maya',
      'paypal': 'PayPal'
    };
    return methods[method] || method;
  }

  function formatPlan(plan) {
    return plan.charAt(0).toUpperCase() + plan.slice(1);
  }

  function renderTable(rows) {
    tbody.innerHTML = '';
    rows.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(u.receipt)}</td>
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(formatPlan(u.plan))}</td>
        <td>${escapeHtml(formatPaymentMethod(u.payment))}</td>
        <td style="text-align:right">
          <div class="actions">
            <button class="pill edit" data-id="${escapeHtml(u.receipt)}">Edit</button>
            <button class="pill delete" data-id="${escapeHtml(u.receipt)}">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function applyFilters() {
    const q = (searchInput && searchInput.value || '').trim().toLowerCase();
    const f = (filterSelect && filterSelect.value) || 'all';
  
    const filtered = users.filter(u => {
      const matchText = !q || (u.receipt + ' ' + u.email).toLowerCase().includes(q);
      const matchFilter = f === 'all' || u.plan === f;
      return matchText && matchFilter;
    });
    renderTable(filtered);
  }

  applyFilters();
  if (searchInput) searchInput.addEventListener('input', applyFilters);
  if (filterSelect) filterSelect.addEventListener('change', applyFilters);

  /* ======= Edit Modal ======= */
  const editModal = document.getElementById('editModal');
  const editForm = document.getElementById('editForm');
  const editEmail = document.getElementById('editEmail');
  const editPassword = document.getElementById('editPassword');
  const editPlan = document.getElementById('editPlan');
  const editPayment = document.getElementById('editPayment');
  const editReceipt = document.getElementById('editReceipt');
  const confirmEdit = document.getElementById('confirmEdit');
  const cancelEdit = document.getElementById('cancelEdit');

  function showEditModal() {
    if (!editModal) return;
    editModal.classList.add('show');
    document.body.classList.add('no-scroll');
    setTimeout(() => { editEmail && editEmail.focus(); }, 80);
  }
  function hideEditModal() {
    if (!editModal) return;
    editModal.classList.remove('show');
    document.body.classList.remove('no-scroll');
  }

  function openEditFor(receipt) {
    const u = users.find(x => x.receipt === receipt);
    if (!u) return;
    editReceipt.value = u.receipt;
    editEmail.value = u.email;
    editPassword.value = '';
    editPlan.value = u.plan || '';
    editPayment.value = u.payment || '';
    showEditModal();
  }

  confirmEdit.addEventListener('click', (e) => {
    e.preventDefault();
    const r = editReceipt.value;
    const idx = users.findIndex(x => x.receipt === r);
    if (idx >= 0) {
      users[idx].email = editEmail.value.trim();
      if (editPassword.value) users[idx].password = editPassword.value;
      users[idx].plan = editPlan.value;
      users[idx].payment = editPayment.value;
      applyFilters();
    }
    hideEditModal();
  });

  cancelEdit.addEventListener('click', (e) => {
    e.preventDefault();
    hideEditModal();
  });

  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) hideEditModal();
  });

  /* ===== Add Modal ===== */
  const addModal = document.getElementById('addModal');
  const addForm = document.getElementById('addForm');
  const addEmail = document.getElementById('addEmail');
  const addPassword = document.getElementById('addPassword');
  const addPlan = document.getElementById('addPlan');
  const addPayment = document.getElementById('addPayment');
  const addReceipt = document.getElementById('addReceipt');
  const confirmAdd = document.getElementById('confirmAdd');
  const cancelAdd = document.getElementById('cancelAdd');
  const addUserBtn = document.getElementById('addUserBtn');

  function showAddModal() {
    if (!addModal) return;
    addModal.classList.add('show');
    document.body.classList.add('no-scroll');
    setTimeout(() => addEmail && addEmail.focus(), 80);
  }
  function hideAddModal() {
    if (!addModal) return;
    addModal.classList.remove('show');
    document.body.classList.remove('no-scroll');
  }

  addUserBtn.addEventListener('click', (e) => {
    addReceipt.value = String(nextId);
    addEmail.value = '';
    addPassword.value = '';
    addPlan.value = '';
    addPayment.value = '';
    showAddModal();
  });

  confirmAdd.addEventListener('click', (e) => {
    e.preventDefault();
    const email = (addEmail && addEmail.value || '').trim();
    const password = (addPassword && addPassword.value || '');
    const plan = (addPlan && addPlan.value || '');
    const payment = (addPayment && addPayment.value || '');
    
    if (!email || !password || !plan || !payment) {
      alert('Please fill in all fields.');
      return;
    }
    const newUser = {
      receipt: addReceipt.value,
      email,
      password,
      plan,
      payment
    };
    users.unshift(newUser);
    nextId++;
    applyFilters();
    hideAddModal();
  });

  cancelAdd.addEventListener('click', (e) => {
    e.preventDefault();
    hideAddModal();
  });

  addModal.addEventListener('click', (e) => {
    if (e.target === addModal) hideAddModal();
  });

  /* ===== Delete modal ===== */
  const deleteModal = document.getElementById('deleteModal');
  const deleteMessage = document.getElementById('deleteMessage');
  const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
  const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

  let deleteTargetId = null;

  function showDeleteModal(message, id) {
    deleteTargetId = id;
    deleteMessage.textContent = message || 'Are you sure you want to delete this user?';
    deleteModal.classList.add('show');
    document.body.classList.add('no-scroll');
    setTimeout(() => confirmDeleteBtn && confirmDeleteBtn.focus(), 80);
  }
  function hideDeleteModal() {
    deleteModal.classList.remove('show');
    document.body.classList.remove('no-scroll');
    deleteTargetId = null;
  }

  confirmDeleteBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (!deleteTargetId) { hideDeleteModal(); return; }
    users = users.filter(u => u.receipt !== deleteTargetId);
    applyFilters();
    hideDeleteModal();
  });

  cancelDeleteBtn.addEventListener('click', (e) => {
    e.preventDefault();
    hideDeleteModal();
  });

  deleteModal.addEventListener('click', (e) => {
    if (e.target === deleteModal) hideDeleteModal();
  });

  /* ===== Delegated table actions ===== */
  document.addEventListener('click', (e) => {
    const editBtn = e.target.closest && e.target.closest('.edit');
    if (editBtn) {
      const id = editBtn.dataset.id;
      openEditFor(id);
      return;
    }

    const delBtn = e.target.closest && e.target.closest('.delete');
    if (delBtn) {
      const id = delBtn.dataset.id;
      showDeleteModal('Delete user ' + id + '? This action cannot be undone.', id);
      return;
    }
  });

  /* ESC closes modals */
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (editModal && editModal.classList.contains('show')) hideEditModal();
      if (addModal && addModal.classList.contains('show')) hideAddModal();
      if (deleteModal && deleteModal.classList.contains('show')) hideDeleteModal();
    }
  });

})();
</script>
</body>
</html>
