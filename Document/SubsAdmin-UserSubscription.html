<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Subscription</title>
  <link rel="stylesheet" href="SubsAdmin-UserSubscription.css" />

  <script>
    window.addEventListener('pageshow', function(event) {
      const userRole = sessionStorage.getItem('user_role');
      if (!userRole || userRole !== 'subsadmin') {
        sessionStorage.clear();
        alert('You do not have permission or your session has expired. Please log in.');
        window.location.replace('StartPage.html');
      }
    });
  </script>
  </head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class_=("logo-pic") />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SubsAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SubsAdmin-Subscription.html" class="menu-item" data-tooltip="Subscription">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Subscription Plans</span>
          </a>
          <a href="SubsAdmin-UserSubscription.html" class="menu-item active" data-tooltip="Customer Subscription">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Subscription</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Subscription Admin1</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="topbar">
        <h1>Customer Subscription</h1>

        <div class="search-panel">
          <div class="userSearch">
            <input id="userSearch" type="search" placeholder="Search by Account ID or email..." />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>

          <select id="planFilter" aria-label="Filter by plan">
            <option value="all">All Plans/Statuses</option>
            <option value="Basic Plan">Basic Plan</option>
            <option value="Standard Plan">Standard Plan</option>
            <option value="Premium Plan">Premium Plan</option>
            <option value="expired">Expired Status</option>
            <option value="downgraded">Downgraded Status</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table id="usersTable" class="users-table">
          <thead>
            <tr>
              <th>ID No</th>
              <th>Email</th>
              <th>Plan</th>
              <th>Payment Method</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="editModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 id="editTitle" class="modal-title">Edit user details</h2>

        <form id="editForm" class="user-form" autocomplete="off">
          <div class="floating field">
            <input id="editEmail" name="email" type="email" placeholder=" " readonly style="background:#f5f5f5; color:#888; cursor:not-allowed;" />
            <label class="floating-label" for="editEmail">Email</label>
            <div class="error-message" id="editEmailError"></div>
          </div>

          <div class="floating field password-field-wrapper">
            <input id="editPassword" name="password" type="password" class="password-input" placeholder=" " />
            <label class="floating-label" for="editPassword">Password (leave blank to keep current)</label>
            <button type="button" class="password-toggle" data-target="editPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
            </button>
            <div class="error-message" id="editPasswordError"></div>
            <div class="password-helper-text" id="editPasswordHelper">
              Must be 8+ chars, 1 uppercase, and 1 number.
            </div>
          </div>
          <div class="floating field">
            <select id="editPlan" name="plan">
              <option value=""></option>
              <option value="Basic Plan">Basic Plan</option>
              <option value="Standard Plan">Standard Plan</option>
              <option value="Premium Plan">Premium Plan</option>
            </select>
            <label class="floating-label" for="editPlan">Subscription Plan</label>
            <div class="error-message" id="editPlanError"></div>
          </div>

          <input type="hidden" id="editUserId" name="id" />
        </form>
      </div>

      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewProfileModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-box profile-modal-box" role="dialog" aria-modal="true">
      <div class="modal-topbar" style="background-color: #1b3c53;"></div>
      <div class="modal-body profile-modal-body" style="padding: 30px;">
        <h2 style="text-align: center; font-size: 24px; font-weight: 700; color: #1b3c53; margin-bottom: 30px;">CUSTOMER PROFILE</h2>
        <div id="profileContent" class="profile-content-area" style="padding: 0 10px;">
          <p style="text-align: center; padding: 40px; color: #888;">Loading profile...</p>
        </div>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="viewReceiptBtn" class="btn confirm" type="button">VIEW RECEIPT</button>
          <button id="closeProfileBtn" class="btn cancel" type="button">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewPaymentReceiptModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-box receipt-modal-box" style="width: 480px;" role="dialog" aria-modal="true">
      <div class="modal-topbar" style="background-color: #1b3c53;"></div>
      <div class="modal-body receipt-modal-body">
        <div id="paymentReceiptContent" class="receipt-content-area">
          <p style="text-align: center; padding: 40px; color: #888;">Loading receipt...</p>
        </div>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="closePaymentReceiptBtn" class="btn cancel" type="button">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

  <script src="SubsAdmin-UserSubscription.js"></script>
</body>
</html>
