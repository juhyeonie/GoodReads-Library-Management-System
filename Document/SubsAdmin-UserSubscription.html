<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Subscription</title>
  <link rel="stylesheet" href="SubsAdmin-UserSubscription.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SubsAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SubsAdmin-Subscription.html" class="menu-item" data-tooltip="Subscription">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Subscription</span>
          </a>
          <a href="SubsAdmin-UserSubscription.html" class="menu-item active" data-tooltip="Customer Subscription">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Subscription</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Subscription Admin1</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="topbar">
        <h1>Customer Subscription</h1>

        <div class="search-panel">
          <div class="userSearch">
            <input id="userSearch" type="search" placeholder="Search by email..." />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>

          <select id="planFilter" aria-label="Filter by plan">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table id="usersTable" class="users-table">
          <thead>
            <tr>
              <th>ID No</th>
              <th>Email</th>
              <th>Plan</th>
              <th>Payment Method</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Edit user modal -->
  <div id="editUserModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editUserTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>

      <div class="modal-body">
        <h2 id="editUserTitle" class="modal-title">Edit user details</h2>

        <form id="editUserForm" class="edit-plan-form" autocomplete="off">
          <div class="field">
            <input id="userEmail" name="email" type="email" placeholder="Email" readonly style="background:#f5f5f5; color:#888; cursor:not-allowed;" />
          </div>

          <div class="field">
            <select id="userPlan" name="plan" required>
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
            </select>
          </div>

          <div class="field">
            <select id="userPayment" name="payment" required>
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
          </div>

          <input type="hidden" id="userId" name="id" />
        </form>
      </div>

      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmUserEdit" class="btn confirm">CONFIRM</button>
          <button id="cancelUserEdit" class="btn cancel">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <script src="SubsAdmin-UserSubscription.js"></script>
</body>
</html>
