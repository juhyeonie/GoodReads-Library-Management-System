<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Subscription Plans</title>
  <link rel="stylesheet" href="SubsAdmin-Subscription.css" />

  <script>
    // This 'pageshow' event runs on initial load AND when using the 'Back' button.
    window.addEventListener('pageshow', function(event) {
      const userRole = sessionStorage.getItem('user_role');
      
      if (!userRole || userRole !== 'subsadmin') {
        sessionStorage.clear();
        alert('You do not have permission or your session has expired. Please log in.');
        window.location.replace('StartPage.html');
      }
    });
  </script>
  </head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SubsAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SubsAdmin-Subscription.html" class="menu-item active" data-tooltip="Subscription">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Subscription</span>
          </a>
          <a href="SubsAdmin-UserSubscription.html" class="menu-item" data-tooltip="Customer Subscription">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Subscription</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Subscription Admin1</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="topbar">
        <h1>Subscription Plans</h1>
      </div>

      <section class="plans">
        </section>
    </main>
  </div>

  <div id="editPlanModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editPlanTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>

      <div class="modal-body">
        <h2 id="editPlanTitle" class="modal-title">Edit Plan Details</h2>

        <form id="editPlanForm" class="edit-plan-form" autocomplete="off">
          <div class="field">
            <label class="field-label">Plan Name</label>
            <input id="planNameInput" name="name" type="text" placeholder="Enter plan name" />
          </div>

          <div class="field">
            <label class="field-label">Monthly Price</label>
            <input id="priceInput" name="price" type="text" placeholder="Enter price (e.g., ₱199 / month)" />
          </div>

          <div class="features-section">
            <h3>Features</h3>
            <div id="featuresList"></div>
            <button type="button" class="add-feature-btn" id="addFeatureBtn">
              + Add Feature
            </button>
          </div>
        </form>
      </div>

      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <script src="SubsAdmin-Subscription.js"></script>
</body>
</html>
