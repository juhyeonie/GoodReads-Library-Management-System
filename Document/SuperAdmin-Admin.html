<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Admin Management</title>
  <link rel="stylesheet" href="UserAdmin-Admin.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SuperAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SuperAdmin-User.html" class="menu-item" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Management</span>
          </a>
          <a href="SuperAdmin-Admin.html" class="menu-item active" data-tooltip="Admin Management">
            <span class="icon"><img src="admin.png" alt="" /></span>
            <span class="text">Admin Management</span>
          </a>
          <a href="SuperAdmin-Subscription.html" class="menu-item" data-tooltip="Plan Management">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Plan Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Super Admin</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <h1>Admin Management</h1>

        <div class="search-panel">
          <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search admins..." />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>
          <select id="filterSelect" class="filter-select">
            <option value="all">All</option>
            <option value="Subscription Admin">Subscription Admin</option>
            <option value="User Admin">User Admin</option>
          </select>
        </div>
      </div>

      <section class="table-section">
        <div class="table-top">
          <h2>List of admins</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new admin</button>
      </section>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Edit admin details</h2>
        <form id="editForm" class="user-form">
          <div class="field">
            <input id="editEmail" name="email" type="email" placeholder="Email" />
            <div class="error-message" id="editEmailError"></div>
          </div>
          <div class="field password-field">
            <input id="editPassword" name="password" type="password" placeholder="Password" />
            <button type="button" class="toggle-password" data-target="editPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="eye-open" d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="eye-open" d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="eye-closed" d="M3 3L21 21" stroke-width="2" stroke-linecap="round" display="none"/>
              </svg>
            </button>
            <div class="error-message" id="editPasswordError"></div>
          </div>
          <div class="field">
            <select id="editRole" name="role">
              <option value="">Select Role</option>
              <option value="Subscription Admin">Subscription Admin</option>
              <option value="User Admin">User Admin</option>
            </select>
            <div class="error-message" id="editRoleError"></div>
          </div>
          <input type="hidden" id="editReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Add a new admin</h2>
        <form id="addForm" class="user-form">
          <div class="field">
            <input id="addEmail" name="email" type="email" placeholder="Email" />
            <div class="error-message" id="addEmailError"></div>
          </div>
          <div class="field password-field">
            <input id="addPassword" name="password" type="password" placeholder="Password" />
            <button type="button" class="toggle-password" data-target="addPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="eye-open" d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="eye-open" d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="eye-closed" d="M3 3L21 21" stroke-width="2" stroke-linecap="round" display="none"/>
              </svg>
            </button>
            <div class="error-message" id="addPasswordError"></div>
          </div>
          <div class="field">
            <select id="addRole" name="role">
              <option value="">Select Role</option>
              <option value="Subscription Admin">Subscription Admin</option>
              <option value="User Admin">User Admin</option>
            </select>
            <div class="error-message" id="addRoleError"></div>
          </div>
          <input type="hidden" id="addReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal-overlay">
    <div class="confirm-box">
      <div>
        <h3 style="color:#1b3c53; margin-bottom:8px;">Confirm deletion</h3>
        <p id="deleteMessage">Are you sure you want to delete this admin?</p>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="btn confirm" type="button">YES, DELETE</button>
          <button id="cancelDeleteBtn" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

 <script src="SuperAdmin-Admin.html"></script>
    
</body>
</html>
