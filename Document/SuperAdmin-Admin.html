<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Admin Management</title>
  <link rel="stylesheet" href="UserAdmin-Admin.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SuperAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SuperAdmin-User.html" class="menu-item" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Management</span>
          </a>
          <a href="SuperAdmin-Admin.html" class="menu-item active" data-tooltip="Admin Management">
            <span class="icon"><img src="admin.png" alt="" /></span>
            <span class="text">Admin Management</span>
          </a>
          <a href="SuperAdmin-Subscription.html" class="menu-item" data-tooltip="Plan Management">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Plan Management</span>
          </a>
          <a href="SuperAdmin-ActivityLog.html" class="menu-item" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Activity Log</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Super Admin</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <h1>Admin Management</h1>

        <div class="search-panel">
          <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search for account ID/email" />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>
          <select id="filterSelect" class="filter-select">
            <option value="all">All Roles</option>
            <option value="SubsAdmin">Subscription Admin</option>
            <option value="UserAdmin">User Admin</option>
          </select>
        </div>
      </div>

      <section class="table-section">
        <div class="table-top">
          <h2>List of admins</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new admin</button>
      </section>
    </main>
  </div>

  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Edit admin details</h2>
        <form id="editForm" class="user-form">
          
          <div class="floating field">
            <input id="editEmail" name="email" type="email" placeholder=" " />
            <label class="floating-label" for="editEmail">Email</label>
            <div class="error-message" id="editEmailError"></div>
          </div>
          <div class="floating field password-field-wrapper">
            <input id="editPassword" name="password" type="password" class="password-input" placeholder=" " />
            <label class="floating-label" for="editPassword">Password (leave blank to keep current)</label>
            <button type="button" class="password-toggle" data-target="editPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12c1.7-3.21 4.57-5.75 8.27-6.9"></path>
                <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
            <div class="error-message" id="editPasswordError"></div>
          </div>

          <div class="floating field">
            <select id="editRole" name="role">
              <option value=""></option>
              <option value="Subscription Admin">Subscription Admin</option>
              <option value="User Admin">User Admin</option>
            </select>
            <label class="floating-label" for="editRole">Admin Role</label>
            <div class="error-message" id="editRoleError"></div>
          </div>

          
          <input type="hidden" id="editUserId" name="userId">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="addModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Add a new admin</h2>
        <form id="addForm" class="user-form">
          <div class="floating field">

            <input id="addEmail" name="email" type="email" placeholder=" " />
            <label class="floating-label" for="addEmail">Email</label>
            <div class="error-message" id="addEmailError"></div>
          </div>

          <div class="floating field password-field-wrapper">
            <input id="addPassword" name="password" type="password" class="password-input" placeholder=" " />
            <label class="floating-label" for="addPassword">Password</label>
            <button type="button" class="password-toggle" data-target="addPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12c1.7-3.21 4.57-5.75 8.27-6.9"></path>
                <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
            <div class="error-message" id="addPasswordError"></div>
          </div>
          <div class="floating field">
            <select id="addRole" name="role">
              <option value=""></option>
              <option value="Subscription Admin">Subscription Admin</option>
              <option value="User Admin">User Admin</option>
            </select>
            <label class="floating-label" for="addRole">Admin Role</label>
            <div class="error-message" id="addRoleError"></div>
          </div>
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal-overlay">
    <div class="modal-box delete-modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Confirm Deletion</h2>
        <p id="deleteMessage" class="delete-message">Are you sure you want to delete this user?</p>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmDeleteBtn" class="btn confirm" type="button">YES</button>
          <button id="cancelDeleteBtn" class="btn cancel" type="button">NO</button>
        </div>
      </div>
    </div>
  </div>
  
<script src="SuperAdmin-Admin.js"></script>
    
</body>
</html>
