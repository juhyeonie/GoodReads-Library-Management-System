<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Dashboard</title>
  <link rel="stylesheet" href="SuperAdmin-Dashboard.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SuperAdmin-Dashboard.html" class="menu-item active" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SuperAdmin-User.html" class="menu-item" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Management</span>
          </a>
          <a href="SuperAdmin-Admin.html" class="menu-item" data-tooltip="Admin Management">
            <span class="icon"><img src="admin.png" alt="" /></span>
            <span class="text">Admin Management</span>
          </a>
          <a href="SuperAdmin-Subscription.html" class="menu-item" data-tooltip="Plan Management">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Plan Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Super Admin</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <h1>Dashboard</h1>
      </div>

      <section class="stats-section">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Free Plan</div>
              <div class="stat-icon">🆓</div>
            </div>
            <div class="stat-value" id="value-free-plan">—</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Standard Plan</div>
              <div class="stat-icon">⭐</div>
            </div>
            <div class="stat-value" id="value-standard-plan">—</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Premium Plan</div>
              <div class="stat-icon">👑</div>
            </div>
            <div class="stat-value" id="value-premium-plan">—</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Total Admins</div>
              <div class="stat-icon">🧑‍💼</div>
            </div>
            <div class="stat-value" id="value-total-admins">—</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Total Customers</div>
              <div class="stat-icon">👥</div>
            </div>
            <div class="stat-value" id="value-total-customers">—</div>
          </div>

          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-title">Total Books</div>
              <div class="stat-icon">📚</div>
            </div>
            <div class="stat-value" id="value-total-books">—</div>
          </div>

          <div class="stat-card tall">
            <div class="stat-header">
              <div class="stat-title">Admin's Activity Log</div>
              <div class="stat-icon">📝</div>
            </div>

            <div class="activity-list" id="activityList">
              <div class="empty-note">No activity yet</div>
            </div>
          </div>
        </div>

        <div class="graphs-label">Graphs</div>
      </section>

    </main>
  </div>

  <script src="SuperAdmin-Dashboard.js"></script>
</body>
</html>
