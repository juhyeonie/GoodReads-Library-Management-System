<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Management</title>
  <link rel="stylesheet" href="UserAdmin-User.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn" aria-pressed="false" title="Toggle sidebar">☰</button>

        <nav class="menu" aria-label="Primary navigation">
          <a href="UserAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon">
              <img src="dashboard.png" alt="" />
            </span>
            <span class="text">Dashboard</span>
          </a>
          <a href="UserAdmin-User.html" class="menu-item active" data-tooltip="Customer Management">
            <span class="icon">
              <img src="user.png" alt="" />
            </span>
            <span class="text">Customer Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">User Admin1</p>
          <a href="#" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" /></a>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="mainContent" class="main-content" role="main">
      <div class="top-bar">
        <h1>Customer Management</h1>

        <div class="search-panel">
          <div class="search-input" role="search">
            <input id="searchInput" type="search" placeholder="Search receipt / email..." aria-label="Search users">
            <button id="searchBtn" aria-label="Search"><img src="search.png" alt="" /></button>
          </div>

          <select id="filterSelect" class="filter-select" aria-label="Filter users">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
            <option value="expired">Expired</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <section class="table-section" aria-labelledby="customers-heading">
        <div class="table-top">
          <h2 id="customers-heading">List of customers</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable" aria-describedby="customers-heading">
            <thead>
              <tr>
                <th>ID no</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- injected by JS -->
            </tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new user</button>
      </section>
    </main>
  </div>

  <!-- ===== Edit User Modal ===== -->
  <div id="editModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 id="editTitle" class="modal-title">Edit user details</h2>
        <form id="editForm" class="modal-form user-form" autocomplete="off">
          <div class="field">
            <input id="editEmail" name="email" type="email" placeholder="Email" required>
          </div>
          <div class="field">
            <input id="editPassword" name="password" type="password" placeholder="Password" required>
          </div>
          <div class="field">
            <select id="editPlan" name="plan" required>
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field">
            <select id="editPayment" name="payment" required>
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
          </div>
          <input type="hidden" id="editReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Add User Modal ===== -->
  <div id="addModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-box" role="document">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 id="addTitle" class="modal-title">Add a new user</h2>
        <form id="addForm" class="modal-form user-form" autocomplete="off" novalidate>
          <div class="field">
            <input id="addEmail" name="email" type="email" placeholder="Email" required>
          </div>
          <div class="field">
            <input id="addPassword" name="password" type="password" placeholder="Password" required>
          </div>
          <div class="field">
            <select id="addPlan" name="plan" required>
              <option value="">Select Plan</option>
              <option value="free">Free</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field">
            <select id="addPayment" name="payment" required>
              <option value="">Select Payment Method</option>
              <option value="credit_card">Credit Card</option>
              <option value="gcash">GCash</option>
              <option value="maya">Maya</option>
              <option value="paypal">PayPal</option>
            </select>
          </div>
          <input type="hidden" id="addReceipt" name="receipt">
        </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Delete Confirm Modal ===== -->
  <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="confirm-box" role="document" aria-live="assertive">
      <div>
        <h3 id="deleteTitle" style="color:#1b3c53; margin-bottom:8px;">Confirm deletion</h3>
        <p id="deleteMessage">Are you sure you want to delete this user?</p>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="btn confirm">YES, DELETE</button>
          <button id="cancelDeleteBtn" class="btn cancel">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

<script src="UserAdmin-User.js"></script>
</body>
</html>
