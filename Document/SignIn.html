<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GoodReads | Sign-in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="SignIn.css">

  <script>
    // This 'pageshow' event runs on initial load AND when using the 'Back' button.
    window.addEventListener('pageshow', function(event) {
      const userRole = sessionStorage.getItem('user_role');

      // If a user role EXISTS, they are already logged in.
      // Redirect them away from the sign-in page.
      if (userRole) {
        console.log('User already logged in. Redirecting from sign-in page...');
        
        switch(userRole) {
          case 'superadmin':
            window.location.replace('SuperAdmin-Dashboard.html');
            break;
          case 'useradmin':
            window.location.replace('UserAdmin-Dashboard.html');
            break;
          case 'subsadmin':
            window.location.replace('SubsAdmin-Dashboard.html');
            break;
          case 'user':
          case 'customer':
            window.location.replace('homepage.html');
            break;
          default:
            // Safe default if role is weird, but they are logged in
            window.location.replace('homepage.html');
        }
      }
      // If no userRole, do nothing and let the sign-in page load.
    });
  </script>
  </head>
<body>

  <header class="header">
    <div class="logo">
      <img src="logo.png" alt="GoodReads" style="height:48px;">
    </div>
  </header>

  <div class="back-container">
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <div class="Form-Container">
    <div class="Signin-Box">
      <h1>Sign in</h1>

      <form id="signinForm" novalidate autocomplete="off">
        <input type="text" name="fake-email" style="position:absolute;top:-9999px;" tabindex="-1" autocomplete="off">
        <input type="password" name="fake-password" style="position:absolute;top:-9999px;" tabindex="-1" autocomplete="off">
        
        <div class="input-group">
          <input type="text" name="email" id="email" placeholder="Email" autocomplete="off" required>
          <div class="error" id="err-email" style="display:none;color:#c33;font-size:0.9rem;margin-top:0.25rem;"></div>
        </div>

        <div class="input-group">
          <input type="password" name="password" id="password" placeholder="Password" autocomplete="new-password" required>
          <div class="error" id="err-password" style="display:none;color:#c33;font-size:0.9rem;margin-top:0.25rem;"></div>
        </div>

        <button type="submit" class="Signin-Btn">Sign in</button>
        <div id="server-msg" style="color:#c33; margin-top:0.5rem; display:none"></div>

        <p class="Signup-Text">
          New to GoodReads? <a href="Step1.html">Sign up now.</a>
        </p>
      </form>
    </div>
  </div>

  <script src="SignIn.js"></script>
</body>
</html>
