<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Subscription Admin Dashboard</title>
  <link rel="stylesheet" href="SubsAdmin-Dashboard.css" />

  <script>
    // This 'pageshow' event runs on initial load AND when using the 'Back' button.
    // This is the complete fix for the back-forward cache issue.
    window.addEventListener('pageshow', function(event) {
      const userRole = sessionStorage.getItem('user_role');
      
      if (!userRole || userRole !== 'subsadmin') {
        sessionStorage.clear();
        alert('You do not have permission or your session has expired. Please log in.');
        window.location.replace('StartPage.html');
      }
    });
  </script>
  </head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SubsAdmin-Dashboard.html" class="menu-item active" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SubsAdmin-Subscription.html" class="menu-item" data-tooltip="Subscription">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Subscription</span>
          </a>
          <a href="SubsAdmin-UserSubscription.html" class="menu-item" data-tooltip="Customer Subscription">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Subscription</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Subscription Admin1</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="dashboard-header">
        <h1>Dashboard</h1>
        <p>Overview of subscription plans and customer activity</p>
      </div>

      <div class="cards-row">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Free Users</span>
            <div class="card-icon">
                <img src="basic.png" alt="Basic Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="card-value" id="card-free">0</div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Standard Users</span>
            <div class="card-icon">
                <img src="standard.png" alt="Standard Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="card-value" id="card-standard">0</div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Premium Users</span>
            <div class="card-icon">
                <img src="premium.png" alt="Premium Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="card-value" id="card-premium">0</div>
        </div>
      </div>

      <section class="table-section">
        <h2 class="section-title">Recent Subscriptions</h2>

        <div class="table-wrap">
          <table id="subsTable" class="subs-table">
            <thead>
              <tr>
                <th>ID No</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th style="text-align:right">Start Date</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="SubsAdmin-Dashboard.js"></script>

  <script>
    (function() {
      try {
        // Find the username element in the sidebar
        const usernameElement = document.querySelector('.sidebar-bottom .user .username');
        
        // Get the email from session storage
        const userEmail = sessionStorage.getItem('user_email');
        
        if (usernameElement && userEmail) {
          // Set the element's text to the stored email
          usernameElement.textContent = userEmail;
        }
      } catch (e) {
        console.error('Error setting username from email:', e);
      }
    })();
  </script>
  </body>
</html>
