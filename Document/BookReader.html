<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads — Reader</title>
  <script src="https://unpkg.com/feather-icons"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="BookReader.css">
  
  <style>
    /* Modal styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background-color: #fff;
      color: #333;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px; /* Changed from 420px */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: left; /* Changed from center */
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    
    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      font-family: 'Archivo', sans-serif;
    }

    .modal-body {
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-icon {
      /* This class is no longer used in the updated modal */
      color: #6366f1; /* Indigo color */
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      flex-direction: row; /* Changed from column */
      justify-content: flex-end; /* Added */
      gap: 12px;
    }

    .modal-btn {
      padding: 10px 20px; /* Adjusted padding */
      border: none;
      border-radius: 8px;
      font-size: 0.95rem; /* Adjusted font size */
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      font-family: 'Archivo', sans-serif;
    }

    .modal-btn-primary {
      background-color: #6366f1;
      color: white;
    }
    .modal-btn-primary:hover {
      background-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .modal-btn-secondary {
      background-color: #eef2ff;
      color: #4f46e5;
    }
    .modal-btn-secondary:hover {
      background-color: #e0e7ff;
    }

    /* === DARK MODE STYLES (MODIFIED TO MATCH IMAGE) === */
    body.dark-mode .modal-content {
      background-color: #19191B; /* Changed to match image (darker) */
      color: #E8EAED; /* Lighter text for better contrast */
    }
    
    /* (modal-icon is removed, so no dark style needed) */
    
    body.dark-mode .modal-btn-primary {
      background-color: #BCB4FF; /* Lavender color from image */
      color: #19191B; /* Dark text from image */
    }
    body.dark-mode .modal-btn-primary:hover {
      background-color: #D6D2FF; /* Lighter hover */
      box-shadow: none;
    }
    
    body.dark-mode .modal-btn-secondary {
      background-color: transparent; /* Transparent bg from image */
      color: #E8EAED; /* Light text from image */
      border: 1px solid #5F6368; /* Dark border from image */
    }
    body.dark-mode .modal-btn-secondary:hover {
      background-color: rgba(232, 234, 237, 0.1); /* Subtle hover */
    }
    /* === END OF MODIFIED STYLES === */

  </style>
</head>
<body class="light-mode">

<nav class="top-nav">
  <div class="nav-left">
    <button id="btnToc" class="nav-icons">
      <i data-feather="menu"></i>
    </button>
    <div class="logo">
      <img src="logo.png" alt="GoodReads Logo">
    </div>
  </div>

  <div class="nav-center">
    <button class="nav-btn" id="btnPrev">
      <i data-feather="chevron-left"></i>
      <span>Previous</span>
    </button>
    <button class="nav-btn" id="btnNext">
      <span>Next</span>
      <i data-feather="chevron-right"></i>
    </button>
  </div>

  <div class="nav-icons">
    <button class="icon-btn" id="btnTheme" title="Toggle Theme">
      <i data-feather="sun"></i>
    </button>
    <button class="icon-btn" id="btnFont" title="Font Settings">
      <i data-feather="type"></i>
    </button>
    <button class="icon-btn" id="btnMode" title="Reading Mode">
      <i data-feather="book-open"></i>
    </button>
    <button class="icon-btn" id="btnSearch" title="Search">
      <i data-feather="search"></i>
    </button>
    <button class="icon-btn" id="btnBookmark" title="Bookmark Page">
      <i data-feather="bookmark"></i>
    </button>
    <button class="icon-btn" id="btnFullscreen" title="Fullscreen">
      <i data-feather="maximize"></i>
    </button>
    <button class="icon-btn" id="btnClose" title="Close Reader">
      <i data-feather="x"></i>
    </button>
  </div>
</nav>

<div class="dropdown-menu" id="fontDropdown">
  <div class="dropdown-title">Font Settings</div>
  
  <div class="setting-group">
    <label class="setting-label">Font Size</label>
    <div class="font-size-controls">
      <button class="font-size-btn" id="decreaseFont">−</button>
      <div class="font-size-display" id="fontSizeDisplay">12px</div>
      <button class="font-size-btn" id="increaseFont">+</button>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">Font Family</label>
    <select id="fontSelect">
      <option value="Georgia, serif">Georgia (Serif)</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="Arial, sans-serif">Arial (Sans-serif)</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value="'Archivo', sans-serif">Gordita (Sans-serif)</option>
    </select>
  </div>
</div>

<div class="dropdown-menu" id="modeDropdown">
  <div class="dropdown-title">Reading Mode</div>
  
  <div class="setting-group">
    <div class="setting-control">
      <button class="mode-toggle-btn active" data-mode="scroll">
        <i data-feather="align-justify"></i>
        <span>Continuous Scroll</span>
      </button>
      <button class="mode-toggle-btn" data-mode="paginated">
        <i data-feather="columns"></i>
        <span>Paginated</span>
      </button>
    </div>
  </div>
</div>

<div class="dropdown-menu" id="searchDropdown">
  <div class="dropdown-title">Search in Document</div>
  
  <input type="text" class="search-input" id="searchInput" placeholder="Search...">
  
  <div class="search-results-container" id="searchResultsContainer">
    <div class="no-results">Enter a search term</div>
  </div>
</div>

<aside class="toc-sidebar" id="tocSidebar">
  <div class="book-info" id="bookInfo">
    <div class="book-title" id="pdfTitle">PDF Document</div>
    <div class="book-author" id="pdfAuthor">Unknown Author</div>
  </div>

  <div class="toc-heading">Table of Contents</div>
  <ul class="toc-list" id="tocList">
    <li class="toc-item">Loading...</li>
  </ul>
</aside>

<main id="viewerContainer" class="reader-container">
  <div class="reading-area scroll-mode" id="readingArea">
    <div class="content-wrapper" id="viewer"></div>
    
    <div class="next-page-indicator" id="nextPageIndicator">
      <button class="next-page-btn" id="scrollNextBtn">Next Page →</button>
    </div>
  </div>
</main>

<div class="page-indicator-bottom" id="pageIndicatorBottom">
  <span id="pageIndicator">0 / 0</span>
</div>

<div class="modal-overlay" id="upgradeModalOverlay">
  <div class="modal-content" id="upgradeModal">
    <div class="modal-title">Upgrade Your Plan</div>
    
    <div class="modal-body">
      Access to this feature requires a <strong>Standard plan</strong> or higher. Upgrade your plan to unlock dark mode and more!
    </div>
    
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" id="closeUpgradeModalBtn">Close</button>
      <button class="modal-btn modal-btn-primary" id="upgradeNowBtn">Upgrade Now</button>
    </div>
  </div>
</div>
<script src="auth.js"></script>

<script type="module" src="BookReader.js"></script>

<script>
  if (typeof callOnProtectedPage === "function") callOnProtectedPage();
</script>

</body>
</html>
