<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads — Reader</title>
  <link rel="stylesheet" href="BookReader.css">
</head>
<body>
  <nav class="reader-top">
    <div class="reader-group left">
      <button id="btnToc" title="Table of Contents">☰ TOC</button>
      <button id="btnPrev" title="Previous Page">←</button>
      <button id="btnNext" title="Next Page">→</button>
      <span id="pageIndicator" class="page-indicator">0 / 0</span>
    </div>

    <div class="reader-group center">
      <input id="pageNumber" type="number" min="1" class="page-input" placeholder="Page #" />
      <button id="btnGo" class="btn-small">Go</button>

      <select id="modeSelect" title="Reading mode" class="mode-select">
        <option value="scroll">Continuous Scroll</option>
        <option value="paginated">Paginated</option>
      </select>

      <button id="btnZoomOut" title="Zoom Out">−</button>
      <button id="btnZoomIn" title="Zoom In">+</button>
      <button id="btnFit" title="Fit to Width">Fit</button>
    </div>

    <div class="reader-group right">
      <input id="searchInput" placeholder="Search..." class="search-input" />
      <button id="btnSearch" title="Search">🔍</button>
      <button id="btnFullscreen" title="Fullscreen (F)">⛶</button>
      <button id="btnClose" title="Close Reader" class="btn-close">✖</button>
    </div>
  </nav>

  <aside id="tocPanel" class="toc-panel hidden">
    <h3>Table of Contents</h3>
    <ul id="tocList"></ul>
  </aside>

  <main id="viewerContainer" class="viewer-container scroll-mode">
    <div id="viewer" class="viewer"></div>
  </main>

  <div id="searchResults" class="search-results hidden"></div>

  <script type="module" src="BookReader.js"></script>
</body>
</html>
