<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Dashboard</title>
  <link rel="stylesheet" href="UserAdmin-Dashboard.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn" aria-pressed="false" title="Toggle sidebar">☰</button>

        <nav class="menu" aria-label="Primary navigation">
          <a href="UserAdmin-Dashboard.html" class="menu-item active" data-tooltip="Dashboard">
            <span class="icon">
              <img src="dashboard.png" alt="" />
            </span>
            <span class="text">Dashboard</span>
          </a>
          <a href="UserAdmin-User.html" class="menu-item" data-tooltip="Customer Management">
            <span class="icon">
              <img src="user.png" alt="" />
            </span>
            <span class="text">Customer Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">User Admin1</p>
          <a href="#" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" /></a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content" role="main">
      <div class="dashboard-header">
        <h1>Dashboard</h1>
        <p>Overview of customer subscriptions and recent activity</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Free Plan</span>
            <div class="stat-icon">
                <img src="basic.png" alt="Basic Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="stat-value" id="freeCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Standard Plan</span>
            <div class="stat-icon">
              <img src="standard.png" alt="Standard Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="stat-value" id="standardCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Premium Plan</span>
            <div class="stat-icon">
              <img src="premium.png" alt="Premium Plan Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="stat-value" id="premiumCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Expired</span>
            <div class="stat-icon">
              <img src="expired.png" alt="Expired Icon" style="width:28px; height:28px;" />
            </div>
          </div>
          <div class="stat-value" id="expiredCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Cancelled</span>
            <div class="stat-icon">x</div>
          </div>
          <div class="stat-value" id="cancelledCount">0</div>
          <div class="stat-trend down">↓ 3% from last month</div>
        </div>
      </div>

      <section class="table-section" aria-labelledby="recent-heading">
        <div class="table-top">
          <h2 id="recent-heading">Recent Customers</h2>
        </div>

        <div class="table-wrap">
          <table id="customersTable" aria-describedby="recent-heading">
            <thead>
              <tr>
                <th>ID No</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th style="text-align:right">Subs. Start Date</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="UserAdmin-Dashboard.js"></script>
</body>
</html>
