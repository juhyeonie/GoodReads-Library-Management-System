<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoodReads | Customer Management</title>
  <link rel="stylesheet" href="SuperAdmin-User.css" />
</head>
<body>

  <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="GoodReads Logo" class="logo-img" />
          <img src="logopic.png" alt="GoodReads" class="logo-pic" />
        </div>

        <button id="collapseBtn" class="collapse-btn">☰</button>

        <nav class="menu">
          <a href="SuperAdmin-Dashboard.html" class="menu-item" data-tooltip="Dashboard">
            <span class="icon"><img src="dashboard.png" alt="" /></span>
            <span class="text">Dashboard</span>
          </a>
          <a href="SuperAdmin-User.html" class="menu-item active" data-tooltip="Customer Management">
            <span class="icon"><img src="user.png" alt="" /></span>
            <span class="text">Customer Management</span>
          </a>
          <a href="SuperAdmin-Admin.html" class="menu-item" data-tooltip="Admin Management">
            <span class="icon"><img src="admin.png" alt="" /></span>
            <span class="text">Admin Management</span>
          </a>
          <a href="SuperAdmin-Subscription.html" class="menu-item" data-tooltip="Plan Management">
            <span class="icon"><img src="subscription.png" alt="" /></span>
            <span class="text">Plan Management</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user">
          <p class="username">Super Admin</p>
          <a href="StartPage.html" class="logout-icon" title="Logout">
            <img src="logout.png" alt="Logout" />
          </a>
        </div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <h1>Customer Management</h1>

        <div class="search-panel">
          <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search Account ID / email..." />
            <button class="search-btn" aria-label="Search">
              <img src="search.png" alt="Search" />
            </button>
          </div>
          <select id="filterSelect" class="filter-select">
            <option value="all">All Plans/Statuses</option>
            <option value="Basic Plan">Basic Plan</option>
            <option value="Standard Plan">Standard Plan</option>
            <option value="Premium Plan">Premium Plan</option>
            <option value="expired">Expired Status</option>
            <option value="cancelled">Cancelled Status</option>
            <option value="downgraded">Downgraded Status</option>
          </select>
        </div>
      </div>

      <section class="table-section">
        <div class="table-top">
          <h2>List of customers</h2>
          <div></div>
        </div>

        <div class="table-wrap">
          <table id="usersTable">
            <thead>
              <tr>
                <th>ID no</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Payment Method</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>

        <button id="addUserBtn" class="add-user" type="button">Add new user</button>
      </section>
    </main>
  </div>

  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Edit user details</h2>
        <form id="editForm" class="user-form">
          <div class="field">
             <label class="field-label">Email</label>
            <span id="editEmailDisplay" class="uneditable-text-display"></span>
            <input id="editEmail" name="email" type="hidden" /> 
            <div class="error-message" id="editEmailError"></div>
          </div>
          <div class="field">
             <label class="field-label">Password</label>
            <input id="editPassword" name="password" type="password" placeholder="Password (leave blank to keep current)" />
            <div class="error-message" id="editPasswordError"></div>
          </div>
          <div class="field">
             <label class="field-label">Subscription Plan</label>
            <select id="editPlan" name="plan">
              <option value="">Select Plan</option>
              <option value="Basic Plan">Basic Plan</option>
              <option value="Standard Plan">Standard Plan</option>
              <option value="Premium Plan">Premium Plan</option>
            </select>
            <div class="error-message" id="editPlanError"></div>
          </div>
          <input type="hidden" id="editReceipt" name="receipt"> </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmEdit" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelEdit" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="addModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-topbar"></div>
      <div class="modal-body">
        <h2 class="modal-title">Add a new user</h2>
        <form id="addForm" class="user-form">
          <div class="field">
            <input id="addEmail" name="email" type="email" placeholder="Email" />
            <div class="error-message" id="addEmailError"></div>
          </div>
          <div class="field">
            <input id="addPassword" name="password" type="password" placeholder="Password" />
            <div class="error-message" id="addPasswordError"></div>
          </div>
          <div class="field">
            <select id="addPlan" name="plan">
              <option value="">Select Plan</option>
              <option value="Basic Plan">Basic Plan</option>
              <option value="Standard Plan">Standard Plan</option>
              <option value="Premium Plan">Premium Plan</option>
            </select>
            <div class="error-message" id="addPlanError"></div>
          </div>
          <div class="field">
            <select id="addPayment" name="payment">
              <option value="">Select Payment Method</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Gcash">GCash</option>
              <option value="Maya">Maya</option>
              <option value="Paypal">PayPal</option>
              <option value="Free Plan">Free Plan</option>
            </select>
            <div class="error-message" id="addPaymentError"></div>
          </div>
          </form>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="confirmAdd" class="btn confirm" type="button">CONFIRM</button>
          <button id="cancelAdd" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal-overlay">
    <div class="confirm-box">
      <div>
        <h3 style="color:#1b3c53; margin-bottom:8px;">Confirm deletion</h3>
        <p id="deleteMessage">Are you sure you want to delete this user?</p>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="btn confirm" type="button">YES, DELETE</button>
          <button id="cancelDeleteBtn" class="btn cancel" type="button">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div id="viewReceiptModal" class="modal-overlay">
    <div class="modal-box profile-modal-box">
      <div class="modal-topbar" style="background-color: #1b3c53;"></div> <div class="modal-body profile-modal-body" style="padding: 30px;">
        <h2 style="text-align: center; font-size: 24px; font-weight: 700; color: #1b3c53; margin-bottom: 30px;">CUSTOMER PROFILE</h2>
        <div id="receiptContent" class="profile-content-area" style="padding: 0 10px;">
          <p style="text-align: center; padding: 40px; color: #888;">Loading profile...</p>
        </div>
      </div>
      <div class="modal-bottombar">
        <div class="modal-actions">
          <button id="closeReceiptBtn" class="btn cancel" type="button">CLOSE</button>
        </div>
      </div>
    </div>
  </div>
  <script src="SuperAdmin-User.js"></script>
</body>
</html>
